name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Must run after "Install Playwright browsers" -- scripts/audit.mjs
      # launches its own headless Chromium instance (via @playwright/test)
      # against a Vite dev server it starts itself, so it needs the browser
      # binary already installed, same as the E2E step below.
      - name: Audit
        run: pnpm run audit:collage

      - name: E2E
        run: pnpm e2e
