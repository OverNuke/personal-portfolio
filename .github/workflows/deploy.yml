name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails fast, with a clear message, if Pages is not enabled for the repo
      # (Settings -> Pages -> Source: "GitHub Actions"). Must run BEFORE the
      # build: its `base_path` output ('/personal-portfolio' for this project
      # site, '' for a custom domain) is the Vite `base` (see vite.base.ts).
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: pnpm build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}

      # The e2e/audit runs use base '/'; only this build gets the sub-path, so
      # assert it actually landed: a wrong base publishes a blank page (every
      # asset URL 404s) while the deploy still reports success.
      - name: Verify build base path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          base="${BASE_PATH%/}/"
          echo "Expecting assets under: ${base}"
          if ! grep -q "src=\"${base}assets/" dist/index.html; then
            echo "::error::dist/index.html does not load its scripts from ${base}assets/"
            cat dist/index.html
            exit 1
          fi
          test -f dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
